plugins { id 'com.android.application' }
android {
    namespace 'app.cairn.trek'
    compileSdk 35
    compileSdkExtension 15
    defaultConfig {
        applicationId 'app.cairn.trek'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.5.0'
        buildConfigField 'String', 'UPDATE_REPOSITORY', '"dayblox/cairn"'
    }
    signingConfigs {
        release {
            if (System.getenv('CAIRN_KEYSTORE_PATH')) {
                storeFile file(System.getenv('CAIRN_KEYSTORE_PATH'))
                storePassword System.getenv('CAIRN_KEYSTORE_PASSWORD')
                keyAlias System.getenv('CAIRN_KEY_ALIAS')
                keyPassword System.getenv('CAIRN_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
    buildFeatures { aidl true; buildConfig true }
    testOptions { unitTests.includeAndroidResources = true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation project(':routing-engine')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
    testImplementation 'xmlpull:xmlpull:1.1.3.1'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
tasks.register('validateReleaseCredentials') {
    doLast {
        ['CAIRN_KEYSTORE_PATH', 'CAIRN_KEYSTORE_PASSWORD', 'CAIRN_KEY_ALIAS', 'CAIRN_KEY_PASSWORD'].each {
            if (!System.getenv(it)) throw new GradleException("Missing release signing configuration: " + it)
        }
    }
}
tasks.configureEach {
    if (name == 'preReleaseBuild') dependsOn 'validateReleaseCredentials'
}
