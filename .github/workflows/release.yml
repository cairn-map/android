name: Publish signed Cairn update
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_commit:
        description: Merged main commit to release (empty uses current main)
        type: string
        required: false
permissions:
  contents: write
concurrency:
  group: cairn-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Select the merged source commit
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
        run: |
          if ! [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Expected a full source commit SHA.'
            exit 1
          fi
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
          git checkout --detach "$SOURCE_COMMIT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Select the next update version
        id: version
        run: python3 scripts/release-version.py --repository "$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
      - name: Install pinned Android packages
        if: steps.version.outputs.skip != 'true'
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35-ext15" "build-tools;35.0.0" > /dev/null'
      - name: Build, test and lint the merged source
        if: steps.version.outputs.skip != 'true'
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          node --test scripts/test-auto-merge.cjs
          bash gradlew assembleDebug testDebugUnitTest lintDebug --console=plain --max-workers=2
      - name: Build and verify the signed release
        if: steps.version.outputs.skip != 'true'
        env:
          CAIRN_KEYSTORE_BASE64: ${{ secrets.CAIRN_KEYSTORE_BASE64 }}
          CAIRN_KEYSTORE_PASSWORD: ${{ secrets.CAIRN_KEYSTORE_PASSWORD }}
          CAIRN_KEY_ALIAS: ${{ secrets.CAIRN_KEY_ALIAS || 'cairn' }}
          CAIRN_KEY_PASSWORD: ${{ secrets.CAIRN_KEY_PASSWORD || secrets.CAIRN_KEYSTORE_PASSWORD }}
          CAIRN_KEYSTORE_PATH: ${{ runner.temp }}/cairn-release.p12
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          if [ -z "$CAIRN_KEYSTORE_BASE64" ] || [ -z "$CAIRN_KEYSTORE_PASSWORD" ]; then
            echo 'Configure CAIRN_KEYSTORE_BASE64 and CAIRN_KEYSTORE_PASSWORD in GitHub Actions secrets using the Cairn release key.'
            exit 1
          fi
          umask 077
          printf '%s' "$CAIRN_KEYSTORE_BASE64" | base64 --decode > "$CAIRN_KEYSTORE_PATH"
          trap 'rm -f "$CAIRN_KEYSTORE_PATH"' EXIT
          bash gradlew assembleRelease -PcairnVersionCode="$VERSION_CODE" -PcairnVersionName="$VERSION_NAME" --console=plain --max-workers=2
          python3 scripts/prepare-release.py app/build/outputs/apk/release/app-release.apk --expected-version "$VERSION_NAME"
      - name: Publish APK and update manifest together
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version_name }}
        run: |
          TAG="v$VERSION"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          if DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$DRAFT" != true ]; then
              echo 'Refusing to replace an already published release.'
              exit 1
            fi
          else
            gh release create "$TAG" --draft --target "$SOURCE_COMMIT" --title "Cairn $VERSION" --notes-file dist/release-notes.md
          fi
          gh release upload "$TAG" "dist/Cairn-$VERSION.apk" dist/update.json dist/SHA256SUMS --clobber
          gh release edit "$TAG" --draft=false --latest
