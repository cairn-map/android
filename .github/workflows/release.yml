name: Publish signed Cairn update
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_commit:
        description: Merged main commit to release (empty uses current main)
        type: string
        required: false
      validation_run_id:
        description: Optional PR check run ID (empty discovers matching native merge validation)
        type: string
        required: false
permissions:
  contents: write
  actions: read
concurrency:
  group: cairn-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Select the merged source commit
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
        run: |
          if ! [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Expected a full source commit SHA.'
            exit 1
          fi
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
          # Run the freshness check using the current main scripts before
          # checking out historical code that may lack the guard.
          python3 scripts/release-version.py --repository "$GITHUB_REPOSITORY" --source-commit "$SOURCE_COMMIT" > /dev/null
          git checkout --detach "$SOURCE_COMMIT"
      - name: Select the next update version
        id: version
        run: python3 scripts/release-version.py --repository "$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
      - name: Select automation tests
        id: automation
        if: steps.version.outputs.skip != 'true'
        env:
          AUTOMATION_BASE_SHA: ${{ github.event.before }}
        run: python3 scripts/automation_changes.py "$AUTOMATION_BASE_SHA" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/android-toolchain
        if: steps.version.outputs.skip != 'true'
      - name: Verify reusable PR validation
        id: validation
        if: steps.version.outputs.skip != 'true'
        uses: actions/github-script@v8
        env:
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const { reuseValidation } = require('./scripts/reuse-validation.cjs');
            const source = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            const result = await reuseValidation({ github, ...context.repo, source, runId: process.env.VALIDATION_RUN_ID });
            core.info(result.reason);
            core.setOutput('reused', String(result.reused));
      - uses: ./.github/actions/android-test-runtime
        if: steps.version.outputs.skip != 'true' && steps.validation.outputs.reused != 'true'
      - name: Python automation tests (fallback)
        if: steps.version.outputs.skip != 'true' && steps.validation.outputs.reused != 'true' && steps.automation.outputs.required != 'false'
        timeout-minutes: 2
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Node automation tests (fallback)
        if: steps.version.outputs.skip != 'true' && steps.validation.outputs.reused != 'true' && steps.automation.outputs.required != 'false'
        timeout-minutes: 4
        run: |
          for suite in scripts/test-*.cjs; do
            echo "::group::$suite"
            timeout --signal=TERM --kill-after=10s 90s node --test "$suite"
            echo "::endgroup::"
          done
      - name: Build, test and lint the merged source (fallback)
        if: steps.version.outputs.skip != 'true' && steps.validation.outputs.reused != 'true'
        timeout-minutes: 10
        run: bash gradlew assembleDebug testDebugUnitTest lintDebug --console=plain --max-workers=2 --build-cache --stacktrace
      - name: Build and verify the signed release
        if: steps.version.outputs.skip != 'true'
        timeout-minutes: 8
        env:
          CAIRN_KEYSTORE_BASE64: ${{ secrets.CAIRN_KEYSTORE_BASE64 }}
          CAIRN_KEYSTORE_PASSWORD: ${{ secrets.CAIRN_KEYSTORE_PASSWORD }}
          CAIRN_KEY_ALIAS: ${{ secrets.CAIRN_KEY_ALIAS || 'cairn' }}
          CAIRN_KEY_PASSWORD: ${{ secrets.CAIRN_KEY_PASSWORD || secrets.CAIRN_KEYSTORE_PASSWORD }}
          CAIRN_KEYSTORE_PATH: ${{ runner.temp }}/cairn-release.p12
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          if [ -z "$CAIRN_KEYSTORE_BASE64" ] || [ -z "$CAIRN_KEYSTORE_PASSWORD" ]; then
            echo 'Configure CAIRN_KEYSTORE_BASE64 and CAIRN_KEYSTORE_PASSWORD in GitHub Actions secrets using the Cairn release key.'
            exit 1
          fi
          umask 077
          printf '%s' "$CAIRN_KEYSTORE_BASE64" | base64 --decode > "$CAIRN_KEYSTORE_PATH"
          trap 'rm -f "$CAIRN_KEYSTORE_PATH"' EXIT
          bash gradlew assembleRelease -PcairnVersionCode="$VERSION_CODE" -PcairnVersionName="$VERSION_NAME" --console=plain --max-workers=2 --build-cache --stacktrace
          python3 scripts/prepare-release.py app/build/outputs/apk/release/app-release.apk --expected-version "$VERSION_NAME"
      - name: Publish APK and update manifest together
        if: steps.version.outputs.skip != 'true'
        timeout-minutes: 3
        env:
          VERSION: ${{ steps.version.outputs.version_name }}
        run: |
          TAG="v$VERSION"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          # GitHub generates a per-release changelog of merged PRs/commits since
          # the previous release. Generate it again for interrupted draft retries.
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$SOURCE_COMMIT" \
            --jq '.body' > dist/release-notes.md
          if [ ! -s dist/release-notes.md ]; then
            echo 'GitHub returned empty release notes; refusing to publish.'
            exit 1
          fi
          if DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$DRAFT" != true ]; then
              echo 'Refusing to replace an already published release.'
              exit 1
            fi
            gh release edit "$TAG" --notes-file dist/release-notes.md
          else
            gh release create "$TAG" --draft --target "$SOURCE_COMMIT" --title "Cairn $VERSION" --notes-file dist/release-notes.md
          fi
          gh release upload "$TAG" "dist/Cairn-$VERSION.apk" dist/update.json dist/SHA256SUMS --clobber
          gh release edit "$TAG" --draft=false --latest
