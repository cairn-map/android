name: Merge passing pull requests
on:
  workflow_run:
    workflows: [Android checks]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Runs from the default branch and never checks out PR code.
      - name: Merge the checked PR and start its release
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const eventRun = context.payload.workflow_run;
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: eventRun.id });
            if (run.status !== 'completed' || run.conclusion !== 'success' || run.run_attempt !== eventRun.run_attempt) {
              core.info('The latest attempt has not passed; nothing to merge.');
              return;
            }
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const candidates = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit,
              { owner, repo, commit_sha: run.head_sha });
            for (const candidate of candidates) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: candidate.number });
              if (pr.state !== 'open' || pr.draft || pr.base.ref !== repository.default_branch || pr.head.sha !== run.head_sha) continue;
              const { data: result } = await github.rest.pulls.merge({ owner, repo, pull_number: pr.number,
                sha: run.head_sha, merge_method: 'merge' });
              if (!result.merged) throw new Error(result.message);
              core.info(`Merged PR #${pr.number} as ${result.sha}.`);
              // GITHUB_TOKEN merges do not trigger push workflows; dispatch explicitly.
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'release.yml',
                ref: repository.default_branch, inputs: { source_commit: result.sha, validation_run_id: String(run.id) } });
              if (pr.head.repo?.full_name === repository.full_name && pr.head.ref !== repository.default_branch) {
                try {
                  const { data: head } = await github.rest.git.getRef({ owner, repo, ref: `heads/${pr.head.ref}` });
                  if (head.object.sha === run.head_sha) await github.rest.git.deleteRef({ owner, repo, ref: `heads/${pr.head.ref}` });
                } catch (error) {
                  if (error.status !== 404) core.warning(`Merged, but could not remove ${pr.head.ref}: ${error.message}`);
                }
              }
            }
