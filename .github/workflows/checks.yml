name: Android checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install pinned Android packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35-ext15" "build-tools;35.0.0" > /dev/null'
      - name: Build, test and lint
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          node --test scripts/test-auto-merge.cjs
          bash gradlew assembleDebug testDebugUnitTest lintDebug --console=plain --max-workers=2
