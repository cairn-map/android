name: Android checks
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-checks-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-toolchain
      - name: Python automation tests
        timeout-minutes: 2
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Node automation tests
        timeout-minutes: 2
        run: node --test scripts/test-*.cjs
      - name: Build, test and lint
        timeout-minutes: 10
        run: bash gradlew assembleDebug testDebugUnitTest lintDebug --console=plain --max-workers=2 --build-cache --stacktrace
      - name: Record the validated source and toolchain
        env:
          VALIDATED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/validation-proof.cjs validation.json
      - name: Save validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: validated-source-${{ github.run_attempt }}
          path: validation.json
          if-no-files-found: error
          retention-days: 7
