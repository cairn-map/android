name: Cairn Android toolchain
description: Set up Java and cache the pinned Android SDK and Robolectric runtimes
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle
    - name: Locate Android SDK
      id: sdk
      shell: bash
      run: printf 'root=%s\n' "$ANDROID_HOME" >> "$GITHUB_OUTPUT"
    - name: Cache pinned Android SDK packages
      id: sdk-cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ steps.sdk.outputs.root }}/platforms/android-35-ext15
          ${{ steps.sdk.outputs.root }}/build-tools/35.0.0
        key: android-sdk-${{ runner.os }}-${{ runner.arch }}-35-ext15-build-tools-35.0.0-v1
    - name: Cache Robolectric Android runtimes
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository/org/robolectric/android-all-instrumented
        key: robolectric-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/build.gradle', 'app/src/test/**/*.java') }}-v1
        restore-keys: robolectric-${{ runner.os }}-${{ runner.arch }}-
    - name: Install pinned Android packages
      if: steps.sdk-cache.outputs.cache-hit != 'true'
      shell: bash
      run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35-ext15" "build-tools;35.0.0" > /dev/null'
