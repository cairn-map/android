name: Cairn Android toolchain
description: Set up Java, cached Gradle state and required Android SDK packages
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v6
    - name: Ensure required Android packages
      shell: bash
      run: |
        # Hosted images already include these packages. Restoring a cache over
        # root-owned SDK files fails and costs more than checking their presence.
        packages=()
        if [[ ! -f "$ANDROID_HOME/platforms/android-35-ext15/android.jar" ]]; then
          packages+=("platforms;android-35-ext15")
        fi
        if [[ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt" || ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]]; then
          packages+=("build-tools;35.0.0")
        fi
        if (( ${#packages[@]} )); then
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "${packages[@]}" > /dev/null
        fi
